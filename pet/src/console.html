<!DOCTYPE html>
<html lang="zh" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'">
<title>TD 记忆守护</title>
<link rel="stylesheet" href="console.css">
</head>
<body>

<!-- ====== 液态背景光斑 ====== -->
<div class="aurora" aria-hidden="true">
  <div class="blob b1"></div>
  <div class="blob b2"></div>
  <div class="blob b3"></div>
</div>

<!-- ====== 顶栏(可拖) ====== -->
<header id="bar" class="glass">
  <div class="brand">
    <img src="logo-128.png" alt="">
    <div class="brand-txt">
      <b>TD 记忆守护</b>
      <span>TENCENTDB · MEMORY · MCP</span>
    </div>
  </div>
  <nav id="tabs">
    <button data-tab="home" class="active">总览</button>
    <button data-tab="memory">记忆</button>
    <button data-tab="skills">技能</button>
    <button data-tab="wiki">Wiki</button>
    <button data-tab="graph">图谱</button>
    <button data-tab="update">更新</button>
  </nav>
  <div class="bar-ctl">
    <button class="icon-btn" id="btn-settings" title="设置">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
    </button>
    <button class="icon-btn" id="btn-theme" title="切换主题">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
    </button>
    <span id="health-pill" class="pill">检测中</span>
    <button class="win-btn" id="win-min" title="最小化">—</button>
    <button class="win-btn" id="win-close" title="关闭">×</button>
  </div>
</header>

<!-- ====== 主区 ====== -->
<main id="main">

  <!-- 总览 -->
  <section data-page="home" class="page active">
    <div class="row stat-row">
      <div class="stat glass"><i></i><div><b id="s-status">—</b><span>连接状态</span></div></div>
      <div class="stat glass"><i></i><div><b id="s-latency">—</b><span>延迟</span></div></div>
      <div class="stat glass"><i></i><div><b id="s-assets">—</b><span>团队资产</span></div></div>
      <div class="stat glass"><i></i><div><b id="s-mem">—</b><span>记忆条数</span></div></div>
    </div>
    <div class="row two-col">
      <div class="card glass">
        <h3>最近记忆 <button class="mini" data-act="reload-layers">刷新</button></h3>
        <div id="layers" class="list"><div class="empty">加载中…</div></div>
      </div>
      <div class="card glass">
        <h3>快速检索</h3>
        <div class="quick-search">
          <input id="qs-input" placeholder="比如:排涝站 数据库 设计">
          <button id="qs-go" class="btn-primary">检索</button>
        </div>
        <div id="qs-result" class="result"></div>
      </div>
    </div>
  </section>

  <!-- 记忆 -->
  <section data-page="memory" class="page">
    <div class="toolbar glass">
      <input id="mem-q" placeholder="检索对话记忆…">
      <select id="mem-topk"><option>5</option><option>10</option><option>20</option></select>
      <button data-act="memory-search" class="btn-primary">检索</button>
      <button data-act="memory-layers" class="btn-ghost">L1/L2/L3 分层</button>
    </div>
    <div id="mem-out" class="out glass"></div>
  </section>

  <!-- 技能 -->
  <section data-page="skills" class="page">
    <div class="toolbar glass">
      <button data-act="skill-list" class="btn-primary">刷新目录</button>
    </div>
    <div id="skill-out" class="out glass grid"></div>
  </section>

  <!-- Wiki -->
  <section data-page="wiki" class="page">
    <div class="toolbar glass">
      <input id="wiki-q" placeholder="检索 Wiki…">
      <button data-act="wiki-search" class="btn-primary">检索</button>
    </div>
    <div id="wiki-out" class="out glass"></div>
  </section>

  <!-- 图谱 -->
  <section data-page="graph" class="page">
    <div class="toolbar glass">
      <input id="graph-q" placeholder="检索代码图谱…">
      <button data-act="graph-search" class="btn-primary">检索</button>
    </div>
    <div id="graph-out" class="out glass"></div>
  </section>

  <!-- 更新 -->
  <section data-page="update" class="page">
    <div class="card glass update-card">
      <div class="update-head">
        <img src="logo-128.png" class="update-logo" alt="">
        <div>
          <b id="up-current">—</b>
          <span id="up-status">当前版本</span>
        </div>
      </div>
      <div id="up-progress" class="up-progress"><i style="width:0%"></i></div>
      <div id="up-message" class="up-message"></div>
      <div class="up-actions">
        <button id="up-check" class="btn-primary">检查更新</button>
        <button id="up-download" class="btn-ghost" style="display:none">下载</button>
        <button id="up-install" class="btn-primary" style="display:none">重启安装</button>
        <button id="up-open-releases" class="btn-ghost">查看 Releases</button>
      </div>
      <div id="up-notes" class="up-notes"></div>
    </div>
  </section>
</main>

<!-- ====== 设置弹窗 ====== -->
<div id="settings-mask" class="mask">
  <div class="settings glass">
    <header>
      <b>设置</b>
      <button id="settings-close" class="icon-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </header>

    <div class="settings-body">
      <div class="sgroup">
        <h4>记忆库连接</h4>
        <label class="row"><span>面板地址</span><input id="set-url" placeholder="http://muhuihao.top:8125"></label>
        <label class="row"><span>User Key</span><input id="set-key" type="password" placeholder="sk-mem-…"></label>
        <label class="row"><span>Team ID</span><input id="set-team" placeholder="team-…"></label>
        <label class="row"><span>Agent ID</span><input id="set-agent" placeholder="agt-…"></label>
        <label class="row"><span>Task ID</span><input id="set-task" placeholder="task-…"></label>
      </div>

      <div class="sgroup">
        <h4>桌面宠物</h4>
        <label class="row"><span>置顶</span><input type="checkbox" class="switch" id="set-top"></label>
        <label class="row"><span>鼠标穿透</span><input type="checkbox" class="switch" id="set-through"></label>
        <label class="row"><span>不透明度</span><input type="range" id="set-opacity" min="0.3" max="1" step="0.05"></label>
        <label class="row"><span>轮询间隔</span><input type="number" id="set-interval" min="15" max="600" step="5"><i>秒</i></label>
      </div>

      <div class="sgroup">
        <h4>外观</h4>
        <label class="row"><span>主题</span>
          <select id="set-theme">
            <option value="dark">深色</option>
            <option value="light">浅色</option>
            <option value="auto">跟随系统</option>
          </select>
        </label>
      </div>

      <div class="sgroup">
        <h4>系统</h4>
        <label class="row"><span>开机自启</span><input type="checkbox" class="switch" id="set-autostart"></label>
        <label class="row"><span>自动检查更新</span><input type="checkbox" class="switch" id="set-autoupdate"></label>
      </div>

      <div class="sgroup">
        <h4>AI 人格(可选)</h4>
        <label class="row"><span>启用</span><input type="checkbox" class="switch" id="set-ai-on"></label>
        <label class="row"><span>Endpoint</span><input id="set-ai-endpoint" placeholder="https://api.openai.com/v1"></label>
        <label class="row"><span>API Key</span><input id="set-ai-key" type="password" placeholder="sk-…"></label>
        <label class="row"><span>Model</span><input id="set-ai-model" placeholder="deepseek-chat"></label>
      </div>
    </div>

    <footer>
      <button id="settings-save" class="btn-primary">保存</button>
      <button id="settings-cancel" class="btn-ghost">取消</button>
    </footer>
  </div>
</div>

<script src="console.js"></script>
</body>
</html>
