<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:">
<title>TD Pet</title>
<style>
:root{
  --accent:#ff5139;
  --accent-2:#ff7a5c;
  --ok:#34d399;
  --layer-mid:#c8c8cf;
  --layer-bot:#7c7c84;
  --bg:#08080d;
  --txt:#e5e5ea;
  --txt-dim:#6b6b76;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:transparent;font-family:"Segoe UI","Microsoft YaHei",system-ui,sans-serif}
#stage{
  position:relative;width:100%;height:100%;
  cursor:grab;user-select:none;border-radius:18px;
}
#stage:active{cursor:grabbing}
#stage.dragging{transition:none}

/* 主体整体 */
#pet{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  filter:drop-shadow(0 8px 24px rgba(0,0,0,.35));
}

/* 悬浮气泡(消息) */
#bubble{
  position:absolute;left:50%;bottom:calc(100% - 34px);transform:translate(-50%,8px) scale(.92);
  min-width:180px;max-width:250px;
  background:rgba(16,16,20,.92);backdrop-filter:blur(6px);
  border:1px solid rgba(255,255,255,.07);border-radius:12px;
  padding:10px 14px;color:var(--txt);
  font-size:12px;line-height:1.5;letter-spacing:.2px;
  opacity:0;pointer-events:none;
  transition:opacity .25s ease,transform .25s cubic-bezier(.34,1.4,.64,1);
  box-shadow:0 12px 32px rgba(0,0,0,.45);
}
#bubble.show{opacity:1;transform:translate(-50%,0) scale(1)}
#bubble .who{
  display:block;font-size:10px;color:var(--accent);
  letter-spacing:2px;font-weight:600;margin-bottom:4px;
}
#bubble .txt{white-space:pre-wrap;word-break:break-word}

/* 右下小控 */
#ctrl{
  position:absolute;inset:auto 8px 8px auto;
  display:flex;gap:6px;opacity:0;transition:opacity .2s;
}
#stage:hover #ctrl{opacity:1}
#ctrl button{
  width:26px;height:26px;border:none;border-radius:8px;
  background:rgba(255,255,255,.06);color:var(--txt-dim);
  cursor:pointer;font-size:12px;line-height:1;
  transition:background .15s,color .15s;
}
#ctrl button:hover{background:rgba(255,81,57,.15);color:var(--accent)}

/* 连线状态点 */
#dot{
  position:absolute;top:8px;left:8px;width:6px;height:6px;border-radius:50%;
  background:var(--txt-dim);transition:background .4s;box-shadow:0 0 0 3px rgba(255,255,255,.03);
}
#dot.on{background:var(--accent);box-shadow:0 0 0 3px rgba(255,81,57,.18)}
#dot.err{background:#8a3b35;box-shadow:0 0 0 3px rgba(138,59,53,.18)}

canvas{display:block}
</style>
</head>
<body>
<div id="stage">
  <div id="pet"></div>
  <div id="dot"></div>
  <div id="bubble"><span class="who"></span><span class="txt"></span></div>
  <div id="ctrl">
    <button id="btn-ping" title="刷新">⟳</button>
    <button id="btn-console" title="控制台">⌘</button>
  </div>
</div>
<script src="pet.js"></script>
</body>
</html>
