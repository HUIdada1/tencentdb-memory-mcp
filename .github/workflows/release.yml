# 发布流水线：手动触发（workflow_dispatch）。
# 版本号严格递增，tag 一经发布不可复用。
# 客户端（安装版 electron-updater / 便携版 latest.yml 比对）发布后立即可见。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则用 pet/package.json 的 version）'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pet/package-lock.json

      - name: 版本校验
        shell: bash
        run: |
          cd pet
          PKG_VERSION="$(node -p "require('./package.json').version")"
          INPUT_VERSION="${{ inputs.version }}"
          EXISTING_TAGS="$(git ls-remote --tags https://github.com/HUIdada1/tencentdb-memory-mcp.git 'refs/tags/v*' | sed 's#.*refs/tags/##;s#\^{}##' || true)"
          LATEST_TAG="$(printf '%s\n' "$EXISTING_TAGS" | sort -V | tail -1 || true)"
          node -e "
            const argv = process.argv.slice(1);
            const pkg = argv[0], input = argv[1], latest = argv[2] || '';
            if (input && input !== pkg) { console.error('输入版本 ' + input + ' 与 package.json 的 ' + pkg + ' 不一致'); process.exit(1); }
            const gt = (a, b) => {
              const pa = String(a).replace(/^v/, '').split('.').map((n) => parseInt(n, 10) || 0);
              const pb = String(b).replace(/^v/, '').split('.').map((n) => parseInt(n, 10) || 0);
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const d = (pa[i] || 0) - (pb[i] || 0);
                if (d > 0) return true;
                if (d < 0) return false;
              }
              return false;
            };
            if (latest && !gt(pkg, latest)) { console.error('版本 ' + pkg + ' 必须严格高于 GitHub 当前最新 tag ' + latest); process.exit(1); }
            console.log('版本校验通过：' + pkg + (latest ? ' > ' + latest : '（首个版本）'));
          " "$PKG_VERSION" "$INPUT_VERSION" "$LATEST_TAG"

      - name: 安装依赖
        run: |
          cd pet
          npm ci

      - name: 打包并发布 Release
        run: |
          cd pet
          npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 校验 latest.yml 已发布
        shell: bash
        run: |
          cd pet
          PKG_VERSION="$(node -p "require('./package.json').version")"
          URL="https://github.com/HUIdada1/tencentdb-memory-mcp/releases/download/v${PKG_VERSION}/latest.yml"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$URL" 2>/dev/null | grep -q "^version: ${PKG_VERSION}$"; then
              echo "latest.yml 校验通过：version ${PKG_VERSION}"
              exit 0
            fi
            echo "第 $i 次校验未通过，20 秒后重试…"
            sleep 20
          done
          echo "::error::latest.yml 发布校验失败"
          exit 1
