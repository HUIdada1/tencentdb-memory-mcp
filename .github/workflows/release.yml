# 发布流水线：手动触发（workflow_dispatch）。
# 双产物：① Electron 控制台应用（electron-builder --publish always，NSIS 安装版 + 便携版 + latest.yml，
#   安装版走 electron-updater 热更新，便携版读 latest.yml 比对版本提示手动下载）；② Node SEA 单文件守护进程 exe。
# 手动触发式发版；版本号严格递增，tag 一经发布不可复用（语义化版本 + 数值比较，不按字典序）。
# 注意：appId（com.tdai.pet）不可更改，改它会让老用户的升级路径断裂（NSIS 升级按 appId 派生 GUID 识别）。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则用 pet/package.json 的 version）'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write # 创建 Release/tag 必需，否则 electron-builder 发布 403
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pet/package-lock.json

      - name: 校验版本号（root/pet/daemon/mcp 一致 + 与输入一致 + 严格高于 GitHub 最新 tag）
        shell: bash
        run: |
          PET_VERSION="$(node -p "require('./pet/package.json').version")"
          ROOT_VERSION="$(node -p "require('./package.json').version")"
          DAEMON_VER="$(node -e "process.stdout.write((require('fs').readFileSync('daemon/tdai-daemon.js','utf8').match(/APP_VER = '([^']+)'/)||[])[1]||'')")"
          MCP_VER="$(node -e "process.stdout.write((require('fs').readFileSync('mcp/tdai-mcp.js','utf8').match(/SERVER_VER = '([^']+)'/)||[])[1]||'')")"
          INPUT_VERSION="${{ inputs.version }}"
          # electron-builder 按 v{version} 创建 tag，已存在即失败；tag 一旦发布版本号永久不可复用
          EXISTING_TAGS="$(git ls-remote --tags https://github.com/HUIdada1/tencentdb-memory-mcp.git 'refs/tags/v*' | sed 's#.*refs/tags/##;s#\^{}##' || true)"
          LATEST_TAG="$(printf '%s\n' "$EXISTING_TAGS" | sort -V | tail -1 || true)"
          node -e "
            const argv = process.argv.slice(1);
            const pet = argv[0], root = argv[1], input = argv[2], latest = argv[3] || '';
            if (input && input !== pet) { console.error('输入版本 ' + input + ' 与 pet/package.json 的 ' + pet + ' 不一致'); process.exit(1); }
            if (pet !== root) { console.error('pet/package.json (' + pet + ') 与根 package.json (' + root + ') 版本不一致，请同步'); process.exit(1); }
            const gt = (a, b) => {
              const pa = String(a).replace(/^v/, '').split('.').map((n) => parseInt(n, 10) || 0);
              const pb = String(b).replace(/^v/, '').split('.').map((n) => parseInt(n, 10) || 0);
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const d = (pa[i] || 0) - (pb[i] || 0);
                if (d > 0) return true;
                if (d < 0) return false;
              }
              return false;
            };
            if (latest && !gt(pet, latest)) { console.error('版本 ' + pet + ' 必须严格高于 GitHub 当前最新 tag ' + latest + '（tag 一旦发布不可复用，请升级版本号）'); process.exit(1); }
            console.log('版本校验通过：' + pet + (latest ? ' > ' + latest : '（首个版本）'));
          " "$PET_VERSION" "$ROOT_VERSION" "$INPUT_VERSION" "$LATEST_TAG"
          # 代码内版本常量必须同步：否则 exe/应用界面会显示混淆的版本号
          if [ "$DAEMON_VER" != "$PET_VERSION" ]; then echo "::error::daemon APP_VER ($DAEMON_VER) 与版本号 $PET_VERSION 不一致"; exit 1; fi
          if [ "$MCP_VER" != "$PET_VERSION" ]; then echo "::error::mcp SERVER_VER ($MCP_VER) 与版本号 $PET_VERSION 不一致"; exit 1; fi
          echo "版本常量一致：daemon=$DAEMON_VER mcp=$MCP_VER"

      - name: 冒烟自检（源码运行）
        shell: bash
        run: |
          node daemon/tdai-daemon.js health
          node mcp/tdai-mcp.js list

      - name: 安装测试依赖（jsdom 等，仅 pet/）
        # 全量测试里有 6 个套件依赖 pet/node_modules/jsdom（根目录保持零依赖）
        run: npm ci --prefix pet

      - name: 全量测试（16 个套件，发版门禁）
        # 早先这里只跑 4 条冒烟，12 个套件里 8 个从不执行 —— 界面回归要等发版才暴露。
        # 现在与 CI 走同一条 test:ci，确保"能发出去的版本一定通过了全部测试"。
        run: npm run test:ci

      - name: 构建 SEA 单文件守护进程 exe
        shell: bash
        run: |
          node --experimental-sea-config sea-config.json
          cp "$(dirname "$(which node)")/node.exe" tdai-daemon.exe
          npx --yes postject tdai-daemon.exe NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: 冒烟自检（daemon exe 运行）
        shell: bash
        run: |
          ./tdai-daemon.exe health
          ./tdai-daemon.exe hook --q "test" | wc -c

      - name: 安装依赖（pet）
        # 已在上面「安装测试依赖」步骤装过（npm ci --prefix pet 是同一个安装），
        # 但 SEA 构建步骤不碰 pet/，为可读性保留在此处声明"打包前的依赖已就绪"。
        # npm ci 会清空 node_modules 重装，重复执行代价约 30s，故改为校验已就绪。
        shell: bash
        run: |
          if [ ! -d pet/node_modules ]; then npm ci --prefix pet; else echo "pet/node_modules 已就绪，跳过重复安装"; fi

      - name: 生成更新说明（build/release-notes.md）
        # electron-builder 会在 buildResources（build/）下找 release-notes.md，
        # 读到的内容写进 latest.yml 的 releaseNotes 字段，electron-updater 把它作为
        # info.releaseNotes 抛给主进程，应用「更新中心」的 #up-notes 据此渲染。
        # 此前该文件不存在 → latest.yml 无 releaseNotes → 更新说明恒为空。
        run: node scripts/make-release-notes.cjs

      - name: 打包并发布 Electron 控制台应用（NSIS + 便携版 + latest.yml）
        run: npx electron-builder --win --publish always
        working-directory: pet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 回填 Release 页面说明
        # electron-publish 的 createRelease() 只发 tag_name/name/draft 三个字段，
        # **不含 body** —— 所以 releaseInfo.releaseNotes 只进 latest.yml，不进 Release 页面。
        # 这里用 gh 单独把同一份说明写到 Release body，让网页端也能看到更新内容。
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./pet/package.json').version")"
          if [ -s build/release-notes.md ]; then
            gh release edit "v${VERSION}" \
              --notes-file build/release-notes.md \
              --title "TD记忆守护 v${VERSION}"
            echo "已回填 Release v${VERSION} 的说明"
          else
            echo "::warning::build/release-notes.md 缺失或为空，Release 页面将没有说明"
          fi

      - name: 上传守护进程 exe 到同一 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./pet/package.json').version")"
          mv tdai-daemon.exe "tdai-daemon-v${VERSION}-win-x64.exe"
          gh release upload "v${VERSION}" "tdai-daemon-v${VERSION}-win-x64.exe" --clobber

      - name: 校验 latest.yml 与资产已正确发布
        shell: bash
        run: |
          VERSION="$(node -p "require('./pet/package.json').version")"
          # 用带 tag 的直链（无 latest 路由索引延迟）；安装版与便携版的更新检查都依赖 latest.yml
          YML_URL="https://github.com/HUIdada1/tencentdb-memory-mcp/releases/download/v${VERSION}/latest.yml"
          SETUP_URL="https://github.com/HUIdada1/tencentdb-memory-mcp/releases/download/v${VERSION}/TDMemoryGuard-Setup-${VERSION}.exe"
          DAEMON_URL="https://github.com/HUIdada1/tencentdb-memory-mcp/releases/download/v${VERSION}/tdai-daemon-v${VERSION}-win-x64.exe"
          for i in 1 2 3 4 5 6; do
            if curl -fsSL "$YML_URL" 2>/dev/null | grep -q "^version: ${VERSION}$" \
              && curl -fsIL "$SETUP_URL" > /dev/null 2>&1 \
              && curl -fsIL "$DAEMON_URL" > /dev/null 2>&1; then
              echo "发布校验通过：latest.yml version=${VERSION} + Setup exe + daemon exe"
              exit 0
            fi
            echo "第 $i 次校验未通过，20 秒后重试…"
            sleep 20
          done
          echo "::error::发布校验失败（2 分钟内 latest.yml 或资产不可下载/版本不匹配），请检查 Release 资产"
          exit 1
