# 发布流水线：手动触发（workflow_dispatch）。
# 构建 Node SEA 单文件守护进程 exe（含 serve/push/hook/health 子命令），发布到 GitHub Releases。
# 版本号严格递增，tag 一经发布不可复用。
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则用根 package.json 的 version）'
        required: false
        default: ''

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 版本校验
        shell: bash
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          INPUT_VERSION="${{ inputs.version }}"
          EXISTING_TAGS="$(git ls-remote --tags https://github.com/HUIdada1/tencentdb-memory-mcp.git 'refs/tags/v*' | sed 's#.*refs/tags/##;s#\^{}##' || true)"
          LATEST_TAG="$(printf '%s\n' "$EXISTING_TAGS" | sort -V | tail -1 || true)"
          node -e "
            const argv = process.argv.slice(1);
            const pkg = argv[0], input = argv[1], latest = argv[2] || '';
            if (input && input !== pkg) { console.error('输入版本 ' + input + ' 与 package.json 的 ' + pkg + ' 不一致'); process.exit(1); }
            const gt = (a, b) => {
              const pa = String(a).replace(/^v/, '').split('.').map((n) => parseInt(n, 10) || 0);
              const pb = String(b).replace(/^v/, '').split('.').map((n) => parseInt(n, 10) || 0);
              for (let i = 0; i < Math.max(pa.length, pb.length); i++) {
                const d = (pa[i] || 0) - (pb[i] || 0);
                if (d > 0) return true;
                if (d < 0) return false;
              }
              return false;
            };
            if (latest && !gt(pkg, latest)) { console.error('版本 ' + pkg + ' 必须严格高于 GitHub 当前最新 tag ' + latest); process.exit(1); }
            console.log('版本校验通过：' + pkg + (latest ? ' > ' + latest : '（首个版本）'));
          " "$PKG_VERSION" "$INPUT_VERSION" "$LATEST_TAG"

      - name: 冒烟自检（源码运行）
        shell: bash
        run: |
          node daemon/tdai-daemon.js health
          node mcp/tdai-mcp.js list

      - name: 构建 SEA 单文件 exe
        shell: bash
        run: |
          node --experimental-sea-config sea-config.json
          cp "$(dirname "$(which node)")/node.exe" tdai-daemon.exe
          npx --yes postject tdai-daemon.exe NODE_SEA_BLOB sea-prep.blob \
            --sentinel-fuse NODE_SEA_FUSE_fce680ab2cc467b6e072b8b5df1996b2

      - name: 冒烟自检（exe 运行）
        shell: bash
        run: |
          ./tdai-daemon.exe health
          ./tdai-daemon.exe hook --q "test" | wc -c

      - name: 发布 Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          mv tdai-daemon.exe "tdai-daemon-v${VERSION}-win-x64.exe"
          gh release create "v${VERSION}" "tdai-daemon-v${VERSION}-win-x64.exe" \
            --title "v${VERSION}" \
            --notes "TD 记忆守护 v${VERSION}（去掉宠物模块，改为零依赖单文件守护进程）。

          - daemon/tdai-daemon.js：守护服务（:8100 recall/push/health）+ 采集上传（ZCode / Claude Code 会话增量入 NAS）
          - mcp/tdai-mcp.js：MCP server（tdai_* 只读检索工具，新增 my_agents）
          - register-all.cjs：一键注册全客户端（MCP + Claude Code hook + 指令文件 + 可选自启）

          exe 子命令：serve（默认）/ push / hook / health" \
            --latest

      - name: 校验 Release 资产
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          URL="https://github.com/HUIdada1/tencentdb-memory-mcp/releases/download/v${VERSION}/tdai-daemon-v${VERSION}-win-x64.exe"
          for i in 1 2 3 4 5; do
            if curl -fsIL "$URL" > /dev/null 2>&1; then
              echo "Release 资产校验通过：tdai-daemon-v${VERSION}-win-x64.exe"
              exit 0
            fi
            echo "第 $i 次校验未通过，20 秒后重试…"
            sleep 20
          done
          echo "::error::Release 资产校验失败"
          exit 1
